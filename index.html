<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Iron Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --graphite:#15171B;
    --steel:#1E2126;
    --chalk:#EDEAE2;
    --iron:#5C6069;
    --brass:#E3A63D;
    --rust:#C2452C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--graphite);color:var(--chalk);}
  body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  .font-display{font-family:'Oswald',sans-serif;}
  .font-mono{font-family:'JetBrains Mono',monospace;}
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
  input[type=number]{-moz-appearance:textfield;}
  button{cursor:pointer;font-family:inherit;}
  .wrap{max-width:420px;margin:0 auto;padding-left:16px;padding-right:16px;}
  header{position:sticky;top:0;z-index:20;background:var(--graphite);border-bottom:1px solid rgba(92,96,105,0.2);padding-top:16px;padding-bottom:12px;}
  .header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  h1{font-size:18px;letter-spacing:0.04em;text-transform:uppercase;margin:0;}
  #clear-btn{background:none;border:none;color:var(--iron);font-size:12px;padding:4px 8px;border-radius:6px;}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;}
  .day-tab{flex-shrink:0;padding:8px 12px;border-radius:6px;font-size:14px;letter-spacing:0.03em;text-transform:uppercase;background:var(--steel);color:var(--chalk);border:none;transition:background-color .15s ease,color .15s ease;}
  .day-tab.active{background:var(--brass);color:var(--graphite);}
  main{padding-top:16px;padding-bottom:128px;}
  .subtitle{font-size:12px;letter-spacing:0.15em;text-transform:uppercase;color:var(--brass);margin:0 0 16px;}
  .card{background:var(--steel);border-radius:10px;padding:16px;margin-bottom:16px;border-left:3px solid transparent;}
  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:4px;}
  .ex-name{font-size:14px;letter-spacing:0.02em;text-transform:uppercase;line-height:1.3;margin:0;}
  .ex-range{font-size:12px;color:var(--iron);white-space:nowrap;padding-top:2px;}
  .last-line{font-size:12px;color:var(--iron);margin:0 0 12px;}
  .set-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .set-idx{font-size:12px;color:var(--iron);width:12px;}
  .set-input{font-size:14px;border-radius:6px;padding:6px 8px;width:60px;background:var(--graphite);color:var(--chalk);border:1px solid rgba(92,96,105,0.35);}
  .set-input:focus-visible,.day-tab:focus-visible,.action-btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px;}
  .times{font-size:12px;color:var(--iron);}
  .pip{display:inline-block;width:12px;height:12px;border-radius:2px;margin-left:auto;border:1px solid var(--iron);transition:background-color .15s ease,border-color .15s ease;}
  .pip.filled{background:var(--brass);border-color:var(--brass);}
  .card-foot{display:flex;align-items:center;gap:8px;}
  .badge{font-size:12px;padding:4px 8px;border-radius:6px;background:rgba(227,166,61,0.13);color:var(--brass);display:none;}
  .badge.show{display:inline-flex;}
  .timer-btn{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:12px;padding:4px 8px;border-radius:6px;background:none;color:var(--iron);border:1px solid rgba(92,96,105,0.35);}
  .timer-btn.active{color:var(--brass);border-color:var(--brass);}
  .save-bar{position:fixed;bottom:0;left:0;right:0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));background:linear-gradient(to top, var(--graphite) 65%, transparent);}
  #save-btn{width:100%;padding:12px;border-radius:8px;border:none;background:var(--brass);color:var(--graphite);font-size:14px;letter-spacing:0.04em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:8px;}
  .loading{font-size:14px;color:var(--iron);font-family:'JetBrains Mono',monospace;}
  svg{display:block;}
  @media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important;}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="header-row">
      <h1 class="font-display">Iron Log</h1>
      <button id="clear-btn" class="action-btn font-mono" aria-label="Reset history">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6h16Z"/></svg>
      </button>
    </div>
    <div class="tabs" id="day-tabs"></div>
  </div>
</header>

<main class="wrap">
  <p class="subtitle font-display" id="day-subtitle"></p>
  <div id="exercise-list"><p class="loading">Loading log…</p></div>
</main>

<div class="save-bar">
  <div class="wrap" style="padding-left:0;padding-right:0;">
    <button id="save-btn" class="action-btn font-display">
      <svg id="save-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
      <span id="save-label">Save today's log</span>
    </button>
  </div>
</div>

<script>
const DAYS = [
  { id:'d1', short:'D1', subtitle:'Chest · Side Delts · Triceps', exercises:[
    { id:'d1-incline', name:'Incline Press', sets:3, repLow:6, repHigh:10, rest:120 },
    { id:'d1-horiz', name:'Horizontal Press Machine', sets:3, repLow:8, repHigh:12, rest:90 },
    { id:'d1-fly', name:'Cable Flys', sets:2, repLow:12, repHigh:15, rest:60 },
    { id:'d1-lat', name:'Lateral Raises', sets:4, repLow:12, repHigh:15, rest:60 },
    { id:'d1-tri', name:'Tricep Pushdown', sets:3, repLow:10, repHigh:12, rest:60 },
  ]},
  { id:'d2', short:'D2', subtitle:'Back Width · Rear Delts · Biceps', exercises:[
    { id:'d2-pd', name:'Pull-ups / Wide Lat Pulldown', sets:4, repLow:6, repHigh:10, rest:120 },
    { id:'d2-row', name:'Chest-Supported Row', sets:3, repLow:8, repHigh:12, rest:90 },
    { id:'d2-sap', name:'Straight-Arm Pulldown', sets:2, repLow:12, repHigh:15, rest:60 },
    { id:'d2-fp', name:'Face Pulls', sets:3, repLow:15, repHigh:20, rest:60 },
    { id:'d2-curl', name:'Bicep Curls', sets:3, repLow:10, repHigh:12, rest:60 },
  ]},
  { id:'d3', short:'D3', subtitle:'Legs', exercises:[
    { id:'d3-hack', name:'Hack Squat', sets:3, repLow:8, repHigh:12, rest:120 },
    { id:'d3-rdl', name:'Romanian Deadlift', sets:3, repLow:8, repHigh:12, rest:120 },
    { id:'d3-curl', name:'Leg Curl', sets:3, repLow:10, repHigh:15, rest:60 },
    { id:'d3-ext', name:'Leg Extension', sets:2, repLow:12, repHigh:15, rest:60 },
    { id:'d3-calf', name:'Calf Raise (paused)', sets:4, repLow:12, repHigh:15, rest:45 },
  ]},
  { id:'d4', short:'D4', subtitle:'Shoulders (2nd hit) · Abs', exercises:[
    { id:'d4-lat', name:'Lateral Raises (angle 2)', sets:4, repLow:12, repHigh:20, rest:60 },
    { id:'d4-press', name:'Shoulder Press', sets:3, repLow:8, repHigh:12, rest:90 },
    { id:'d4-rdf', name:'Rear Delt Fly', sets:3, repLow:15, repHigh:20, rest:60 },
    { id:'d4-ab', name:'Cable Crunch / Leg Raise', sets:3, repLow:12, repHigh:15, rest:45 },
  ]},
  { id:'d5', short:'D5', subtitle:'Back (2nd hit) · Arms', exercises:[
    { id:'d5-pd', name:'Lat Pulldown (close grip)', sets:3, repLow:8, repHigh:12, rest:90 },
    { id:'d5-row', name:'Seated Cable Row', sets:3, repLow:10, repHigh:12, rest:90 },
    { id:'d5-tri', name:'Overhead Tricep Extension', sets:3, repLow:10, repHigh:12, rest:60 },
    { id:'d5-ham', name:'Hammer Curls', sets:3, repLow:10, repHigh:12, rest:60 },
  ]},
];
const ALL_EXERCISES = DAYS.flatMap(d => d.exercises);

const state = {
  activeDay: 0,
  inputs: {},
  history: { exercises: {} },
  rest: null,
  restInterval: null,
  confirmClear: false,
};
ALL_EXERCISES.forEach(ex => {
  state.inputs[ex.id] = Array.from({ length: ex.sets }, () => ({ weight:'', reps:'' }));
});

function fmtClock(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return m + ':' + String(s).padStart(2,'0');
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function pipFilled(ex, idx){
  const s = state.inputs[ex.id][idx];
  return s.reps !== '' && Number(s.reps) >= ex.repHigh;
}
function allTop(ex){
  return state.inputs[ex.id].every(s => s.reps !== '' && Number(s.reps) >= ex.repHigh);
}
function lastEntry(exId){
  const list = state.history.exercises[exId];
  return list && list.length ? list[list.length-1] : null;
}

function renderTabs(){
  const el = document.getElementById('day-tabs');
  el.innerHTML = DAYS.map((d,i) =>
    `<button class="day-tab${i===state.activeDay?' active':''}" data-day="${i}">${d.short}</button>`
  ).join('');
}

function exerciseCardHTML(ex){
  const last = lastEntry(ex.id);
  const lastLine = last
    ? `<p class="last-line font-mono">last · ${last.sets.map(s => (s.weight||'–') + '×' + (s.reps||'–')).join('  ')} kg</p>`
    : '';
  const rows = state.inputs[ex.id].map((s, idx) => `
    <div class="set-row">
      <span class="set-idx font-mono">${idx+1}</span>
      <input class="set-input font-mono" type="number" inputmode="decimal" placeholder="kg"
        data-ex="${ex.id}" data-idx="${idx}" data-field="weight" value="${s.weight}">
      <span class="times font-mono">×</span>
      <input class="set-input font-mono" type="number" inputmode="numeric" placeholder="reps"
        data-ex="${ex.id}" data-idx="${idx}" data-field="reps" value="${s.reps}">
      <span class="pip${pipFilled(ex, idx) ? ' filled' : ''}" id="pip-${ex.id}-${idx}"></span>
    </div>
  `).join('');
  const resting = state.rest && state.rest.id === ex.id;
  return `
    <div class="card" id="card-${ex.id}" style="border-left-color:${allTop(ex) ? 'var(--brass)' : 'transparent'}">
      <div class="card-head">
        <h3 class="ex-name font-display">${ex.name}</h3>
        <span class="ex-range font-mono">${ex.repLow}–${ex.repHigh}</span>
      </div>
      ${lastLine}
      <div class="set-rows">${rows}</div>
      <div class="card-foot">
        <span class="badge${allTop(ex) ? ' show' : ''}" id="badge-${ex.id}">+ weight next time</span>
        <button class="timer-btn font-mono${resting ? ' active' : ''}" id="timer-${ex.id}" data-ex="${ex.id}" data-rest="${ex.rest}">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>
          <span id="timer-label-${ex.id}">${resting ? fmtClock(state.rest.seconds) : fmtClock(ex.rest)}</span>
        </button>
      </div>
    </div>
  `;
}

function renderDay(){
  const day = DAYS[state.activeDay];
  document.getElementById('day-subtitle').textContent = day.subtitle;
  document.getElementById('exercise-list').innerHTML = day.exercises.map(exerciseCardHTML).join('');
}

function updateExerciseIndicators(exId){
  const ex = ALL_EXERCISES.find(e => e.id === exId);
  if (!ex) return;
  state.inputs[exId].forEach((s, idx) => {
    const pip = document.getElementById(`pip-${exId}-${idx}`);
    if (pip) pip.classList.toggle('filled', pipFilled(ex, idx));
  });
  const badge = document.getElementById(`badge-${exId}`);
  if (badge) badge.classList.toggle('show', allTop(ex));
  const card = document.getElementById(`card-${exId}`);
  if (card) card.style.borderLeftColor = allTop(ex) ? 'var(--brass)' : 'transparent';
}

function startRest(exId, seconds){
  if (state.restInterval) clearInterval(state.restInterval);
  state.rest = { id: exId, seconds, total: seconds };
  paintTimerButton(exId, true, seconds);
  state.restInterval = setInterval(() => {
    if (!state.rest) return;
    state.rest.seconds -= 1;
    if (state.rest.seconds <= 0){
      clearInterval(state.restInterval);
      state.restInterval = null;
      try { navigator.vibrate && navigator.vibrate(250); } catch(e){}
      paintTimerButton(exId, false, seconds);
      state.rest = null;
      return;
    }
    paintTimerButton(exId, true, state.rest.seconds);
  }, 1000);
}
function paintTimerButton(exId, active, seconds){
  const btn = document.getElementById(`timer-${exId}`);
  const label = document.getElementById(`timer-label-${exId}`);
  if (!btn || !label) return;
  btn.classList.toggle('active', active);
  label.textContent = fmtClock(seconds);
}

function saveDay(){
  const day = DAYS[state.activeDay];
  const date = todayISO();
  day.exercises.forEach(ex => {
    const arr = state.inputs[ex.id];
    const hasData = arr.some(s => s.weight !== '' || s.reps !== '');
    if (!hasData) return;
    const entry = { date, sets: arr.map(s => ({ weight: s.weight, reps: s.reps })) };
    const list = state.history.exercises[ex.id] ? [...state.history.exercises[ex.id]] : [];
    const idx = list.findIndex(e => e.date === date);
    if (idx >= 0) list[idx] = entry; else list.push(entry);
    if (list.length > 15) list.shift();
    state.history.exercises[ex.id] = list;
  });
  try {
    localStorage.setItem('workout-log', JSON.stringify(state.history));
    flashSaved();
  } catch(e){
    console.error('Storage error', e);
    alert('Could not save. Your browser storage may be full or disabled (e.g. private/incognito mode).');
  }
}
function flashSaved(){
  const icon = document.getElementById('save-icon');
  const label = document.getElementById('save-label');
  label.textContent = 'Saved';
  icon.innerHTML = '<path d="M20 6 9 17l-5-5"/>';
  setTimeout(() => {
    label.textContent = "Save today's log";
    icon.innerHTML = '<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h8"/>';
  }, 2500);
}

function clearHistory(){
  const btn = document.getElementById('clear-btn');
  if (!state.confirmClear){
    state.confirmClear = true;
    btn.style.color = 'var(--rust)';
    setTimeout(() => { state.confirmClear = false; btn.style.color = 'var(--iron)'; }, 3000);
    return;
  }
  state.history = { exercises: {} };
  ALL_EXERCISES.forEach(ex => {
    state.inputs[ex.id] = Array.from({ length: ex.sets }, () => ({ weight:'', reps:'' }));
  });
  state.confirmClear = false;
  btn.style.color = 'var(--iron)';
  renderDay();
  try { localStorage.setItem('workout-log', JSON.stringify(state.history)); } catch(e){}
}

document.getElementById('day-tabs').addEventListener('click', e => {
  const tab = e.target.closest('.day-tab');
  if (!tab) return;
  state.activeDay = Number(tab.dataset.day);
  renderTabs();
  renderDay();
});

document.getElementById('exercise-list').addEventListener('input', e => {
  const input = e.target.closest('.set-input');
  if (!input) return;
  const { ex, idx, field } = input.dataset;
  state.inputs[ex][idx][field] = input.value;
  updateExerciseIndicators(ex);
});

document.getElementById('exercise-list').addEventListener('click', e => {
  const btn = e.target.closest('.timer-btn');
  if (!btn) return;
  startRest(btn.dataset.ex, Number(btn.dataset.rest));
});

document.getElementById('save-btn').addEventListener('click', saveDay);
document.getElementById('clear-btn').addEventListener('click', clearHistory);

(function init(){
  renderTabs();
  try {
    const raw = localStorage.getItem('workout-log');
    const parsed = raw ? JSON.parse(raw) : { exercises: {} };
    state.history = (parsed && parsed.exercises) ? parsed : { exercises: {} };
  } catch(e) {
    state.history = { exercises: {} };
  }
  renderDay();
})();
</script>
</body>
</html>
